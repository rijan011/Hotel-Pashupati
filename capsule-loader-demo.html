<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inside-Out Black Camouflage Fade Preloader Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #FAF8F5;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Plus Jakarta Sans", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ==========================================================================
       MAIN LANDING PAGE (Underneath preloader)
       ========================================================================== */
    .hero-landing-page {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #111111 0%, #1C1C1C 100%);
      color: #FFFFFF;
      text-align: center;
      padding: 40px 20px;
    }

    .hero-landing-page h1 {
      font-size: 3.5rem;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      background: linear-gradient(180deg, #FFFFFF 0%, #B0B0B0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-landing-page p {
      font-size: 1.15rem;
      color: #A0A0A0;
      max-width: 540px;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .replay-btn {
      padding: 14px 28px;
      background: #C5A059;
      color: #000000;
      border: none;
      border-radius: 9999px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .replay-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 24px rgba(197, 160, 89, 0.4);
    }

    /* ==========================================================================
       BLACK CAMOUFLAGE BACKDROP LAYER (Z-Index: 9998)
       ========================================================================== */
    .black-camouflage-backdrop {
      position: fixed;
      inset: 0;
      background-color: #000000;
      z-index: 9998;
      opacity: 1;
      pointer-events: none;
      transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .black-camouflage-backdrop.fade-out {
      opacity: 0;
    }

    /* ==========================================================================
       INSIDE-OUT SINGLE CONTINUOUS MORPH PRELOADER OVERLAY (Z-Index: 9999)
       ========================================================================== */
    .page-loader-overlay {
      position: fixed;
      inset: 0;
      background-color: #F4F4F2;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;

      /* ONE SINGLE CONTINUOUS INSIDE-OUT CENTER RECTANGLE PORTAL MORPH */
      clip-path: polygon(0% 0%,
          0% 100%,
          calc(50vw - 120px) 100%,
          calc(50vw - 120px) calc(50vh - 120px),
          calc(50vw + 120px) calc(50vh - 120px),
          calc(50vw + 120px) calc(50vh + 120px),
          calc(50vw - 120px) calc(50vh + 120px),
          calc(50vw - 120px) 100%,
          100% 100%,
          100% 0%);
      transition: clip-path 0.9s cubic-bezier(0.77, 0, 0.175, 1),
        opacity 0.4s ease 0.6s,
        visibility 0.4s ease 0.6s;
    }

    /* Initial state before 100%: Overlay solid light cover */
    .page-loader-overlay.solid-cover {
      clip-path: polygon(0% 0%,
          0% 100%,
          calc(50vw - 0px) 100%,
          calc(50vw - 0px) calc(50vh - 0px),
          calc(50vw + 0px) calc(50vh - 0px),
          calc(50vw + 0px) calc(50vh + 0px),
          calc(50vw - 0px) calc(50vh + 0px),
          calc(50vw - 0px) 100%,
          100% 100%,
          100% 0%);
    }

    /* Inside-Out Expansion Triggered AT EXACTLY 100% */
    .page-loader-overlay.inside-out-expand {
      clip-path: polygon(0% 0%,
          0% 100%,
          -20vw 100%,
          -20vw -20vh,
          120vw -20vh,
          120vw 120vh,
          -20vw 120vh,
          -20vw 100%,
          100% 100%,
          100% 0%);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Viewfinder Frame Stage */
    .loader-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100vh;
      transition: opacity 0.4s ease, transform 0.6s cubic-bezier(0.77, 0, 0.175, 1);
    }

    .page-loader-overlay.inside-out-expand .loader-stage {
      opacity: 0;
      transform: scale(1.1);
    }

    /* Square Viewfinder Frame (240x240px) */
    .viewfinder-frame {
      position: relative;
      width: 240px;
      height: 240px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .viewfinder-frame.active {
      opacity: 1;
      transform: scale(1);
    }

    /* Base Faint Rectangle Border (1px hairline) */
    .rect-border-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .rect-bg-border {
      fill: none;
      stroke: rgba(58, 58, 58, 0.25);
      stroke-width: 1;
    }

    /* Rectangle Surface Loading Line Tracer (0% -> 100%) */
    .rect-surface-tracer {
      fill: none;
      stroke: #2A2A2A;
      stroke-width: 2.5;
      stroke-linecap: square;
      stroke-dasharray: 960;
      stroke-dashoffset: 960;
      transition: stroke-dashoffset 0.06s linear;
      filter: drop-shadow(0 0 2px rgba(42, 42, 42, 0.3));
    }

    /* Full SVG Temple Logo */
    .logo-mark-svg {
      width: 130px;
      height: 130px;
      overflow: visible;
      position: relative;
      z-index: 3;
    }

    .temple-full-svg {
      fill: #2A2A2A;
      opacity: 0.95;
    }

    /* Tagline below Viewfinder Frame (HOTEL PASHUPATI) */
    .loader-tagline {
      margin-top: 28px;
      font-size: 0.76rem;
      font-weight: 700;
      color: #3A3A3A;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.4s ease 0.3s, transform 0.4s ease 0.3s;
    }

    .loader-tagline.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* VENDING / SLOT MACHINE PERCENTAGE COUNTER */
    .slot-counter-wrap {
      position: absolute;
      bottom: 40px;
      display: flex;
      align-items: center;
      font-size: 0.92rem;
      font-weight: 700;
      color: #3A3A3A;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.4s ease 0.3s;
    }

    .slot-counter-wrap.active {
      opacity: 1;
    }

    .slot-digit-col {
      height: 1.4em;
      width: 0.72em;
      position: relative;
      overflow: hidden;
    }

    .slot-reel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.08s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .slot-reel span {
      height: 1.4em;
      line-height: 1.4em;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .slot-percent {
      margin-left: 3px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #3A3A3A;
    }
  </style>
</head>

  <script>
    function easeOutExpo(x) {
      return x === 1 ? 1 : 1 - Math.pow(2, -10 * x);
    }

    function startInsideOutPreloader() {
      const overlay = document.getElementById('pageLoaderOverlay');
      const backdrop = document.getElementById('blackCamouflageBackdrop');
      const frame = document.getElementById('viewfinderFrame');
      const tagline = document.getElementById('loaderTagline');
      const counterWrap = document.getElementById('slotCounterWrap');
      const rectTracer = document.getElementById('rectTracer');

      const reelHundreds = document.getElementById('reelHundreds');
      const reelTens = document.getElementById('reelTens');
      const reelUnits = document.getElementById('reelUnits');

      const totalPerimeter = 960;

      // Reset Timeline
      overlay.className = 'page-loader-overlay solid-cover';
      backdrop.classList.remove('fade-out');

      frame.classList.remove('active');
      tagline.classList.remove('active');
      counterWrap.classList.remove('active');

      if (rectTracer) rectTracer.style.strokeDashoffset = totalPerimeter;

      reelHundreds.style.transform = 'translateY(0)';
      reelTens.style.transform = 'translateY(0)';
      reelUnits.style.transform = 'translateY(0)';

      // t=0.0s - Frame, tagline, slot counter fade in
      setTimeout(() => {
        frame.classList.add('active');
        tagline.classList.add('active');
        counterWrap.classList.add('active');
      }, 50);

      // t=0.4s - Surface line tracer draws & slot counter rolls (0 -> 100)
      setTimeout(() => {
        let startTime = null;
        const duration = 2200;

        function updateCounter(timestamp) {
          if (!startTime) startTime = timestamp;
          const elapsed = timestamp - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const easedProgress = easeOutExpo(progress);
          const currentVal = Math.floor(easedProgress * 100);

          // Update Surface Line Tracer
          if (rectTracer) {
            const offset = totalPerimeter - (totalPerimeter * easedProgress);
            rectTracer.style.strokeDashoffset = offset;
          }

          // Slot Reel Dynamics
          const hundredsDigit = currentVal >= 100 ? 1 : 0;
          const tensDigit = Math.floor((currentVal % 100) / 10);
          const unitsDigit = currentVal % 10;

          reelHundreds.style.transform = `translateY(${-hundredsDigit * 1.4}em)`;
          reelTens.style.transform = `translateY(${-tensDigit * 1.4}em)`;
          reelUnits.style.transform = `translateY(${-unitsDigit * 1.4}em)`;

          if (progress < 1) {
            requestAnimationFrame(updateCounter);
          } else {
            // Lock into 100%
            reelHundreds.style.transform = 'translateY(-1.4em)';
            reelTens.style.transform = 'translateY(0em)';
            reelUnits.style.transform = 'translateY(0em)';
            if (rectTracer) rectTracer.style.strokeDashoffset = 0;

            // AT EXACTLY 100% -> INSIDE-OUT PORTAL REVEALS BLACK BACKDROP & GRADUALLY FADES OUT!
            overlay.classList.remove('solid-cover');
            overlay.classList.add('inside-out-expand');

            // Black Camouflage Gradually Fades Out over the website
            setTimeout(() => {
              backdrop.classList.add('fade-out');
            }, 100);
          }
        }

        requestAnimationFrame(updateCounter);
      }, 400);
    }

    window.addEventListener('DOMContentLoaded', () => {
      startInsideOutPreloader();
    });
  </script>

</body>

</html>
